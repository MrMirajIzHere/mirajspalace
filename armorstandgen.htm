<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<html><head>
	<title>Armor Stand Generator</title>
	<link href="images/faviconCon.png" rel="icon" type="image/png">
	<meta content="text/html; charset=iso-8859-1" http-equiv="Content-Type">
	<meta content="Miraj's Palace" property="og:title">
	<meta content="" property="og:description">
	<meta content="http://mirajspalace.space" property="og:url">
	<meta content="http://mirajspalace.space/images/mirajspalaceEMBED.png" property="og:image">
	<meta content="#462b52" data-react-helmet="true" name="theme-color">
	
	<link rel="stylesheet" href="common.css?=1">
<script src="common.js"></script>

	<style>
	@font-face {
	font-family: Sharp;
	src: url('Px437_Sharp_PC3K.ttf'); 
	font-smooth: never;
} 
</style>
</head>

<body background="images/animspace.gif" link="#FF0000" vlink="#7F7F7F">
	<hr style="color:ffffff">
	<span style="text-align: center; line-height:2; display: block; margin: auto; font-family: Sharp; image-rendering: pixelated; color: #ffffff; ">
	<br>
    <label for="tag">Tag:</label><br>
    <input type="text" id="tag" size="63" placeholder="tag"><br><br>
	<label for="customName">CustomName:</label><br>
	<input type="text" id="customName" size="63" placeholder="Armor Stand"><br><br>
	<label for="nameVisible">CustomNameVisible:</label><br>
	<input type="checkbox" id="nameVisible"><br><br>
	<label for="marker">Marker:</label><br>
	<input type="checkbox" id="marker" checked><br><br>
    <input type="submit" value="submit" onclick="submit()">
	<br><br>
	<hr style="color:ffffff">
	<div id="output">
		<span>command:</span><br>
		<span id="cmdOut"></span><br>
		<button id="copyBtn" onclick="copyCommand()">Copy</button>
		<hr style="color:ffffff">
	</div>
	
	</span>
<script>
function submit() {
	let tag = document.getElementById('tag').value;
	let customName = document.getElementById('customName').value;
	let nameVisible = document.getElementById('nameVisible').checked;
	let marker = document.getElementById('marker').checked;
	
	if (!tag || tag.trim() === '') {
		tag = document.getElementById('tag').placeholder;
	}
	
	if (!customName || customName.trim() === '') {
		customName = tag;
	}

	console.log("Tag: " + tag);
	console.log("CustomName: " + customName);
	console.log("Name Visible: " + nameVisible);
	console.log("Marker: " + marker);

	let entityTag = '{id:"minecraft:armor_stand"';
	entityTag += ',CustomName:\'"' + customName + '"\'';
	entityTag += ',Tags:["' + tag + '"]';
	
	if (nameVisible) {
		entityTag += ',CustomNameVisible:1b';
	}
	
	if (marker) {
		entityTag += ',Marker:1b';
	}
	
	entityTag += '}';

	let giveCmd = '/give @p minecraft:llama_spawn_egg{display:{Name:\'{"text":"Armor Stand Spawn Egg"}\'},EntityTag:' + entityTag + '} 1';
	
	document.getElementById('cmdOut').innerHTML = giveCmd;
	
	document.getElementById('copyBtn').style.display = 'inline';
}

function copyCommand() {
	let cmdText = document.getElementById('cmdOut').innerText;
	
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(cmdText).then(function() {
			showCopyMsg('Copied!');
		}).catch(function() {
			fallbackCopy(cmdText);
		});
	} else {
		fallbackCopy(cmdText);
	}
}

function fallbackCopy(text) {
	let textarea = document.createElement('textarea');
	textarea.value = text;
	textarea.style.position = 'fixed';
	textarea.style.opacity = '0';
	document.body.appendChild(textarea);
	textarea.select();
	try {
		document.execCommand('copy');
	} catch (e) {
	}
	document.body.removeChild(textarea);
}

document.addEventListener('keydown', function(e) {
	if (e.key === 'Enter') {
		submit();
	}
});
</script>

</body></html>
